name: Compilar APK

# Se dispara al subir cambios a main, o a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'server/**'
      - '**.md'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # Hace falta para publicar el APK como release descargable.
    permissions:
      contents: write
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      # Capacitor 8 declara engines node >= 22. Con Node 20, "cap add android" corta
      # con exit 1 y el build muere ahí.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      # Si algo vuelve a fallar, estas versiones son lo primero que hay que mirar.
      - name: Versiones
        run: |
          echo "node    $(node --version)"
          echo "npm     $(npm --version)"
          echo "java    $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Instalar dependencias
        run: npm install

      - name: Armar la carpeta web
        run: node scripts/preparar-www.mjs

      # La carpeta android/ no está en el repositorio: la genera Capacitor acá.
      # El "if" evita que falle si alguna vez quedara cacheada.
      - name: Crear el proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sincronizar el contenido web
        run: npx cap sync android

      - name: Agregar permisos al manifiesto
        run: node scripts/permisos-android.mjs

      - name: Cachear Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: lifetime-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error

      # Los artefactos de Actions vienen en .zip y solo se bajan con sesión iniciada en
      # GitHub, algo incómodo desde el celular. El release deja el .apk suelto en una
      # dirección fija y pública:
      #   https://github.com/agusgrosso81/lifetime-game/releases/latest/download/lifetime-game.apk
      - name: Publicar el APK para bajar desde el celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lifetime-game.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          sleep 3
          gh release create apk-latest lifetime-game.apk \
            --title "Lifetime Game — última versión" \
            --notes "APK de depuración, compilado automáticamente desde la rama main (commit ${GITHUB_SHA::7}).

          **Para instalarlo:** abrí este enlace desde el celular y tocá \`lifetime-game.apk\`.
          Android va a pedirte permiso para instalar apps de esta fuente: aceptalo.

          Si ya tenías la app instalada, esto la actualiza y **respeta tus datos**."
